<!doctype html>
<html lang="ja">
<head>
{{>head}}
</head>
<body>

{{>header}}

<main>
  <section class="hero">

{{>hero-bg}}

    {{#school.nameLatin}}<p class="hero__latin">{{school.nameLatin}}</p>
    {{/school.nameLatin}}
    <p class="hero__slogan"><span class="hero__slogan-line"></span>{{festival.slogan}}<span class="hero__slogan-line"></span></p>

    <a class="scrollcue" href="#works">
      <span class="scrollcue__text">SCROLL</span>
      <span class="scrollcue__bar"></span>
    </a>
  </section>

  <section class="works" id="works">
    <h2 class="visually-hidden">{{page.footerWord}} — 展示作品</h2>

    <div class="branchmap branchmap--works">
      <span class="branchmap__stem"></span>
      <span class="branchmap__bar"></span>
      <ul class="branchmap__row">
{{#works}}        <li class="branchmap__node">
          <span class="branchmap__grade">{{ordinal}}</span>
          <span class="branchmap__word">{{title}}</span>
          <p class="branchmap__desc">{{description}}</p>
{{#hasUrl}}          <a class="branchmap__btn" href="{{url}}">作品一覧を見る</a>
{{/hasUrl}}        </li>
{{/works}}
      </ul>
    </div>
  </section>
</main>

{{>footer}}
<script src="{{staticPrefix}}/js/script.js"></script>
</body>
</html>
