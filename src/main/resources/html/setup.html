<!doctype html>
<html lang="ja">
<head>
{{>head}}
</head>
<body>

{{>header}}

<main>
  <section class="concept">
    <header class="concept__head">
      <h2 class="concept__label">SETUP</h2>
      <p class="concept__lead">
        設定キーの一覧です。値は表示されません。<br>
        詳しくは SETUP.md を参照してください。
      </p>
    </header>

    <div class="setup">
      <table class="setup__table">
        <thead>
          <tr><th>Key</th><th>Status</th><th>What it does</th></tr>
        </thead>
        <tbody>
{{#configKeys}}          <tr>
            <td><code>{{name}}</code>{{#required}} <strong>*</strong>{{/required}}</td>
            <td>{{#set}}set{{/set}}{{^set}}unset{{/set}}</td>
            <td>{{description}}</td>
          </tr>
{{/configKeys}}        </tbody>
      </table>
      <p class="setup__note"><strong>*</strong> required</p>
    </div>
  </section>
</main>

{{>footer}}
</body>
</html>
