<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point Text</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0e16;
    color: #eef3f8;
    overflow: hidden;
    font-family: ui-sans-serif, "Helvetica Neue", Arial, sans-serif;
  }

  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: clamp(16px, 2.6vw, 30px) clamp(18px, 3.4vw, 46px);
  }

  .toolbar__label {
    font-size: 11px;
    letter-spacing: .3em;
    color: rgba(238, 243, 248, .55);
    white-space: nowrap;
  }

  .toolbar__input {
    flex: 1;
    min-width: 0;
    border: 0;
    border-bottom: 1px solid rgba(238, 243, 248, .35);
    background: transparent;
    color: #eef3f8;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho",
                 "Noto Serif JP", "Source Han Serif", serif;
    font-size: clamp(20px, 3vw, 30px);
    letter-spacing: .12em;
    padding: 6px 2px;
    outline: none;
    transition: border-color .3s;
  }
  .toolbar__input:focus { border-bottom-color: #c8a24a; }
  .toolbar__input::placeholder { color: rgba(238, 243, 248, .25); }

  .toolbar__count {
    font-size: 11px;
    letter-spacing: .2em;
    color: rgba(238, 243, 248, .45);
    white-space: nowrap;
  }

  .hint {
    position: fixed;
    bottom: clamp(18px, 3vh, 30px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 10px;
    letter-spacing: .35em;
    text-indent: .35em;
    color: rgba(238, 243, 248, .35);
    pointer-events: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>


<div class="toolbar">
  <span class="toolbar__label">TEXT</span> 
  <input class="toolbar__input" id="text" type="text" value="茎"
         placeholder="введите текст…" autocomplete="off" spellcheck="false">
  <span class="toolbar__count" id="count"></span>
</div>

<canvas id="dots"></canvas>

<p class="hint">The dots scatter away from the cursor.</p>

<script>

(() => {
  const canvas = document.getElementById('dots');
  const input   = document.getElementById('text');
  const count   = document.getElementById('count');
  if (!canvas || !canvas.getContext) return;

  const ctx  = canvas.getContext('2d', { alpha: true });
  const FONT = '600 %dpx "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Source Han Serif", serif';

  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const fine  = matchMedia('(pointer: fine)');

  let dpr = 1, W = 0, H = 0;
  let px, py, hx, hy, vx, vy, sz, bucket;
  let n = 0;
  const BUCKETS = [0.38, 0.62, 0.82, 1];

  const pointer = { x: -1e4, y: -1e4, on: false };

  let intro = 0;
  let raf = 0;
  let clock = 0, lastT = 0;

  function build() {
    const text = input.value || '';
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const est = (fs) => {
      const off  = document.createElement('canvas');
      const octx = off.getContext('2d');
      octx.font = FONT.replace('%d', Math.round(fs));
      const tracking = fs * 0.1;
      const widths = Array.from(text).map((c) => octx.measureText(c).width);
      return widths.reduce((a, b) => a + b, 0) + tracking * Math.max(0, text.length - 1);
    };

    let fontSize = H * 0.3;
    let textW = est(fontSize);
    const maxW = W * 0.92;
    if (textW > maxW) { fontSize = fontSize * maxW / textW; textW = est(fontSize); }
    fontSize = Math.min(fontSize, H * 0.5);

    const gap = Math.max(2.4, fontSize / 60);

    const off  = document.createElement('canvas');
    const octx = off.getContext('2d', { willReadFrequently: true });
    const font = FONT.replace('%d', Math.round(fontSize));
    octx.font = font;

    const chars    = Array.from(text);
    const tracking = fontSize * 0.1;
    const widths   = chars.map((c) => octx.measureText(c).width);
    textW          = widths.reduce((a, b) => a + b, 0) + tracking * Math.max(0, chars.length - 1);

    const tw = Math.max(1, Math.ceil(textW)) + 8;
    const th = Math.ceil(fontSize * 1.3);

    off.width = tw; off.height = th;
    octx.font = font;
    octx.textAlign = 'left';
    octx.textBaseline = 'middle';
    octx.fillStyle = '#fff';

    let cx = (tw - textW) / 2;
    chars.forEach((c, i) => {
      octx.fillText(c, cx, th / 2);
      cx += widths[i] + tracking;
    });

    const data = octx.getImageData(0, 0, tw, th).data;

    const ox = (W - tw) / 2;
    const oy = (H - th) / 2 - H * 0.02;

    const HX = [], HY = [], SZ = [], BK = [];

    const alphaAt = (x, y) =>
      (x < 0 || y < 0 || x >= tw || y >= th) ? 0 : data[((y | 0) * tw + (x | 0)) * 4 + 3];

    const push = (x, y, size, b) => { HX.push(x); HY.push(y); SZ.push(size); BK.push(b); };

    for (let y = 0; y < th; y += gap) {
      for (let x = 0; x < tw; x += gap) {
        const a = alphaAt(x, y);
        if (a < 90) continue;

        const edge = alphaAt(x - gap, y) < 90 || alphaAt(x + gap, y) < 90 ||
                     alphaAt(x, y - gap) < 90 || alphaAt(x, y + gap) < 90;

        if (!edge && Math.random() > 0.52) continue;

        const size = gap * (Math.random() < (edge ? 0.3 : 0.14) ? 0.8 : 0.52);
        const b = edge ? 2 + (Math.random() * 2 | 0)
                       : (Math.random() * 3 | 0);
        push(ox + x, oy + y, size, b);

        if (edge && Math.random() < 0.16) {
          const ang = Math.random() * Math.PI * 2;
          const r   = gap * (1.6 + Math.random() * 3.4);
          push(ox + x + Math.cos(ang) * r, oy + y + Math.sin(ang) * r, gap * 0.44, 0);
        }
      }
    }

    n  = HX.length;
    hx = Float32Array.from(HX);
    hy = Float32Array.from(HY);
    sz = Float32Array.from(SZ);
    bucket = Uint8Array.from(BK);
    px = new Float32Array(n);
    py = new Float32Array(n);
    vx = new Float32Array(n);
    vy = new Float32Array(n);

    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r   = Math.max(W, H) * (0.35 + Math.random() * 0.5);
      px[i] = W / 2 + Math.cos(ang) * r;
      py[i] = H / 2 + Math.sin(ang) * r * 0.6;
    }
    intro = still.matches ? 1 : 0;

    count.textContent = n ? n + ' точек' : '';
  }

  const R      = 130;
  const FORCE  = 46;
  const SPRING = 0.055;
  const DAMP   = 0.9;

  function frame(now) {
    ctx.clearRect(0, 0, W, H);

    clock += (now - (lastT || now)) / 1000;
    lastT = now;

    if (intro < 1) intro = Math.min(1, intro + 0.012);
    const ease = 1 - Math.pow(1 - intro, 3);

    const mx = pointer.x, my = pointer.y, act = pointer.on && !still.matches;
    const R2 = R * R;

    for (let b = 0; b < 4; b++) {
      ctx.globalAlpha = BUCKETS[b];
      ctx.fillStyle = '#eef3f8';
      ctx.beginPath();

      for (let i = 0; i < n; i++) {
        if (bucket[i] !== b) continue;

        let x = px[i], y = py[i];

        if (intro < 1) {
          x = px[i] += (hx[i] - x) * (0.02 + 0.06 * ease);
          y = py[i] += (hy[i] - y) * (0.02 + 0.06 * ease);
        } else {
          if (act) {
            const dx = x - mx, dy = y - my;
            const d2 = dx * dx + dy * dy;
            if (d2 < R2 && d2 > 0.01) {
              const d = Math.sqrt(d2);
              const f = (1 - d / R) * FORCE / d;
              vx[i] += dx * f * 0.02;
              vy[i] += dy * f * 0.02;
            }
          }
          vx[i] = (vx[i] + (hx[i] - x) * SPRING) * DAMP;
          vy[i] = (vy[i] + (hy[i] - y) * SPRING) * DAMP;
          x = px[i] += vx[i];
          y = py[i] += vy[i];
        }

        const s = sz[i];
        ctx.rect(x - s / 2, y - s / 2, s, s);
      }
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }

  function onMove(e) {
    if (!fine.matches && e.pointerType === 'mouse') return;
    const r = canvas.getBoundingClientRect();
    pointer.x = e.clientX - r.left;
    pointer.y = e.clientY - r.top;
    pointer.on = true;
  }

  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerdown', onMove);
  canvas.addEventListener('pointerleave', () => { pointer.on = false; });

  let rt = 0;
  input.addEventListener('input', () => {
    clearTimeout(rt);
    rt = setTimeout(build, 120);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { clearTimeout(rt); build(); }
  });

  let rs = 0;
  addEventListener('resize', () => {
    clearTimeout(rs);
    rs = setTimeout(build, 180);
  });

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    build();
    if (!raf) raf = requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
