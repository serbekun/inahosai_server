# ---------------------------------------------------------------------------
# INAHOSAI site configuration.
#
# This file is the single source of truth for everything school-specific. A fork
# should copy it to ./config.yaml and edit that copy; the file you are reading is
# the fallback bundled inside the jar.
#
# Load order: $INAHOSAI_CONFIG -> ./config.yaml -> this file.
#
# Unknown keys are an error at startup, so a typo here stops the server with a
# message naming the key rather than silently leaving a value blank.
#
# Nothing in this file is secret. Never put tokens or connection strings here.
# ---------------------------------------------------------------------------

# Set this to true only after you have read the whole file and confirmed every value
# fits your school. The server REFUSES TO START while it is false, so that a fork
# cannot go live still carrying the default school by accident.
is_setup_readed_and_config_edited: false

# TCP port the HTTP server binds to. Change this when 2323 is taken or when a
# proxy expects the site elsewhere. Must be in 1..65535; anything else falls back
# to 2323.
port: 2323

school:
  # Full school name in Japanese. Required.
  name_ja: "茎崎"
  # Short form used in the header mark.
  name_short: "茎崎"
  # Latin transliteration, shown under the hero title. Its first character is the
  # favicon glyph (here "K"), so keep it starting with the initial people recognize.
  name_latin: "KUKIZAKI"

festival:
  # Festival name, shown in the header, hero and footer. Required.
  name: "稲穂祭"
  # One-word theme. Drives the hero slogan and the centre of the theme graph.
  slogan: "つなぐ"
  # First day of the festival. Required.
  #
  # The Japanese era shown on every page ("令和8年") is derived from THIS date, not
  # from the calendar year, because eras change mid-year. Set it to the real date.
  #
  # PLACEHOLDER — change this.
  start_date: "2026-09-18"
  # Last day of the festival. Optional; omit for a one-day festival.
  # PLACEHOLDER — change this.
  end_date: "2026-10-02"
  # The CONCEPT paragraph. Each entry is one line; lines are joined with a break.
  # Written as separate entries rather than one string with markup in it, so the
  # values stay plain text and are escaped like every other config value.
  concept_lead:
    - "稲穂祭は、ひとつのことばから広がっていく。"
    - "時間を、学びを、場所を、世代を——。"
  # Extra lines for the visible ABOUT section on the home page. A factual sentence is
  # generated from school/festival/era/dates/slogan, so these are only for anything
  # that sentence does not already say. Each entry is one paragraph. Leave empty to
  # show only the generated text.
  about: []

hero:
  # Filename inside the images directory used as the hero backdrop. A bare filename,
  # not a path. Leave empty to render no <img> at all — the hero works without one.
  photo: "school.png"
  # Fallback text drawn as particles on the hero canvas. Each page overrides this
  # with its own pages[].hero_dots_text; this value is only used when that is empty.
  dots_text: "茎崎"

stream:
  # Which live platform to embed: "youtube" or "zoom". Set to "none" (or leave blank)
  # when there is no broadcast.
  #
  # Leave this blank to infer the platform from whichever payload is set below, so a
  # config that only fills youtube_id keeps working.
  type: "none"
  # YouTube video id for a live stream — the 11 characters after "v=", NOT a URL.
  # Must match [A-Za-z0-9_-]{11}. Anything else is rejected with a warning and the
  # stream is treated as absent. Leave empty when there is no stream.
  youtube_id: ""
  # Zoom meeting URL (https://...). Only used when type is "zoom". Leave empty when
  # there is no Zoom stream.
  zoom_url: ""

works:
  # Student works listed on the 学び page. Each item has a `key` and a list of
  # `files`. An item with an empty files list renders no button at all, rather than
  # a dead link.
  #
  # One file: the button downloads it directly. Two or more: the button opens a
  # chooser page at /works/{key} listing every file by name. `key` must be a
  # lowercase slug (a-z, 0-9, -) because it is used in that URL.
  #
  # Every item ships pointing at the placeholder PDF so each button works out of the
  # box. Replace the files with your own documents (dropped into data/static/pdf/).
  items:
    - key: shodo
      title: "書道作品"
      description: "一画一画に心を込めて書き上げた、力強く美しい作品です。"
      files:
        - {name: "作品集", url: "/static/v0/pdf/sample.pdf"}
    - key: bijutsu
      title: "美術作品"
      description: "想像力と表現力を生かして描いた、色あざやかな作品です。"
      files:
        - {name: "1年生", url: "/static/v0/pdf/sample.pdf"}
        - {name: "2年生", url: "/static/v0/pdf/sample.pdf"}
    - key: eigo
      title: "英語自己紹介カード"
      description: "自分のことを英語で紹介！個性あふれる自己紹介カードです。"
      files:
        - {name: "作品集", url: "/static/v0/pdf/sample.pdf"}

graph:
  # The theme graph drawn by graph.js on the home, 場所 and 世界 pages.
  #
  # Every "at" and "leaf_at" value is a normalised [x, y] pair in the range 0..1.
  # These positions are hand-tuned, not auto-laid-out: they are placed to avoid
  # collisions and to balance the composition. A fork with different words WILL
  # need to retune them — which is exactly why they live here and not in graph.js.
  #
  # They are only used on wide viewports; the narrow layout stacks nodes on a grid
  # and ignores them.
  center:
    text: "つなぐ"
    at: [0.46, 0.48]
  branches:
    - label: "時間をつなぐ"
      at: [0.27, 0.20]
      leaves: ["過去", "現在", "未来"]
      leaf_at: [[0.10, 0.31], [0.20, 0.09], [0.38, 0.07]]
      # Where clicking this branch goes. A site-relative path or an absolute
      # http(s) URL. Kept next to the branch so link order cannot drift from
      # branch order.
      url: "/jikan"
    - label: "学びをつなぐ"
      at: [0.71, 0.17]
      leaves: ["書道", "美術", "英語"]
      leaf_at: [[0.60, 0.06], [0.80, 0.06], [0.90, 0.26]]
      url: "/manabi"
    - label: "場所をつなぐ"
      at: [0.28, 0.79]
      leaves: ["Live"]
      leaf_at: [[0.13, 0.92], [0.33, 0.93], [0.10, 0.68]]
      url: "/basho"
    - label: "世代をつなぐ"
      at: [0.72, 0.75]
      leaves: ["みんなの投稿。"]
      leaf_at: [[0.88, 0.62], [0.87, 0.90], [0.66, 0.93]]
      url: "/sedai"

site:
  # Where static assets are mounted. Must start with "/" and contain no "..".
  static_prefix: "/static/v0"
  # Public origin, used to build absolute og:url, og:image and canonical URLs, and the
  # sitemap. Leave empty if the site has no stable public URL yet: those tags are then
  # omitted and /sitemap.xml is not served.
  base_url: "https://inahosai.serbekun.com"
  # Optional destination for the extra header link that sits left of the nav. When
  # empty the element is not rendered at all, rather than rendered as a dead link.
  gate_url: ""
  # Text of that link.
  gate_label: "つながり門"
  # Filename inside the images directory for the iOS home-screen icon. Leave empty to
  # omit the tag — an unset icon must not become a 404 on every page.
  apple_touch_icon: ""
  # Filename inside the images directory used for link previews. Falls back to
  # hero.photo when empty.
  og_image: ""
  # Supplementary search terms, written into <meta name="keywords"> and the home page's
  # schema.org Event markup. They help with crawlers that still read them (Yandex and
  # some vertical search); Google ignores meta keywords, so this is a hint, not a
  # ranking factor. List the school and festival under every name people search for.
  # Leave empty to omit the tag entirely.
  keywords:
    - "茎崎"
    - "茎崎中学校"
    - "稲穂祭"
    - "茎崎稲穂祭"
    - "文化祭"
    - "学校"
  # Source repository, linked from the footer next to the MIT licence note. A fork
  # should point this at ITS OWN repository. Leave empty to render no link at all.
  repo_url: "https://github.com/serbekun/inahosai_server"
  # Text of that link.
  repo_label: "GITHUB"
  # Credit shown at the end of the footer, after the school name.
  author: "serbekun"
  # Where that credit links — the author's own page. Leave empty to render the name
  # as plain text rather than a link.
  author_url: "https://github.com/serbekun"
  # The school's own website, linked from the school name in the footer. Leave empty
  # to render the name as plain text.
  school_url: "https://www.tsukuba-school.jp/kuj/"

debug:
  # Serves raw, page-less HTML "playground" files from resources/html/ — files such as
  # point_text.html that are not configured pages and have no clean route — under
  # /debug/<filename>. Off by default, so nothing is published until a fork opts in,
  # even on a production deployment.
  #
  # Note: turning this on (or off) takes effect at startup only, like the page routes.
  enabled: false
  # When set, /debug/* responds only to a request that passes this as the "token" query
  # parameter (e.g. /debug/point_text.html?token=SECRET). Leave empty for no token. A
  # public deployment that shares a playground should usually set one.
  token: ""

pdf:
  # Gate for the PDF files in the on-disk pdf directory, served at /static/v0/pdf/*.
  #
  # When require_auth is true, the visitor submits pdf.token once through the form on
  # the 学び page. The server checks it and answers with an HttpOnly cookie; every
  # later PDF request (and the PDF directory listing) is authorized by that cookie,
  # not by the URL. A missing or wrong token gets 401. The token never appears in a
  # URL, so it cannot leak through access logs, browser history or a Referer header.
  #
  # PDF responses are sent with "Cache-Control: private, no-store" and
  # "X-Robots-Tag: noindex, nofollow", so they stay out of shared caches and search
  # indexes. /static/v0/pdf/ is also disallowed in robots.txt.
  #
  # Set a token whenever require_auth is true; an empty token leaves the PDFs open.
  # Turning this on or off takes effect at startup only.
  require_auth: false
  token: ""

pages:
  # Every page of the site. The shared header iterates this list, so the nav is
  # identical everywhere and aria-current is computed rather than copy-pasted.
  #
  # - key:        internal identifier, also the nav highlight key
  # - route:      the URL this page is served at
  # - template:   the file in resources/html/ to render
  # - nav_label:  text in the header nav
  # - nav_title:  tooltip in the header nav
  # - title:      <title>; a tiny template, e.g. {{school.nameJa}} {{festival.name}}
  #               and {{era}} are filled in. Each value is HTML-escaped.
  # - description: <meta name="description">, og:description and the visible page lead
  # - hero_dots_text: text drawn as particles on the hero canvas
  # - footer_word:    the page's own word, used as the 学び page's hidden heading
  - key: "index"
    route: "/"
    template: "index.html"
    nav_label: "ホーム"
    nav_title: "ホーム — トップページ"
    title: "{{school.nameJa}} {{festival.name}}（{{era}}） — {{festival.slogan}}"
    description: "{{school.nameJa}}の文化祭「{{festival.name}}」（{{era}}）。テーマは「{{festival.slogan}}」。開催日程・展示・会場のご案内。"
    hero_dots_text: "茎崎"
    footer_word: "茎崎"
  - key: "jikan"
    route: "/jikan"
    template: "jikan.html"
    nav_label: "時間"
    nav_title: "時間 — タイムテーブル"
    title: "時間をつなぐ — {{school.nameJa}} {{festival.name}}"
    description: "{{school.nameJa}} {{festival.name}}の時間（タイムテーブル）。過去・現在・未来をつなぐ発表の予定。"
    hero_dots_text: "時間をつなぐ"
    footer_word: "時間をつなぐ"
  - key: "manabi"
    route: "/manabi"
    template: "manabi.html"
    nav_label: "学び"
    nav_title: "学び — 展示・発表"
    title: "学びをつなぐ — {{school.nameJa}} {{festival.name}}"
    description: "{{school.nameJa}} {{festival.name}}の学び。書道・美術・英語など、生徒の展示作品を紹介します。"
    hero_dots_text: "学びをつなぐ"
    footer_word: "学びをつなぐ"
  - key: "basho"
    route: "/basho"
    template: "basho.html"
    nav_label: "場所"
    nav_title: "場所 — 会場マップ"
    title: "場所をつなぐ — {{school.nameJa}} {{festival.name}}"
    description: "{{school.nameJa}} {{festival.name}}の場所。会場マップとライブ配信のご案内。"
    hero_dots_text: "場所をつなぐ"
    footer_word: "場所をつなぐ"
  - key: "sedai"
    route: "/sedai"
    template: "sedai.html"
    nav_label: "世代"
    nav_title: "世代— 交流・世界"
    title: "世代をつなぐ — {{school.nameJa}} {{festival.name}}"
    description: "{{school.nameJa}} {{festival.name}}の世代。みんなの投稿でつながる交流のページ。"
    hero_dots_text: "世代つなぐ"
    footer_word: "世代つなぐ"
